[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "memoria"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "websockets>=15,<16",
    "chromadb>=0.5",
    "openai>=2.0.0",
    "openai-agents==0.0.10",
    "langchain-text-splitters>=0.3",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
    "click>=8.1",
    "webdavclient3>=3.14",
    "apscheduler>=3.10",
]

[project.scripts]
memoria = "memoria.cli.main:cli"

[project.optional-dependencies]
agents = ["openai-agents==0.0.10"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "black>=24", "ruff>=0.7"]

[tool.setuptools]
packages = ["memoria", "memoria.agents", "memoria.core", "memoria.storage", "memoria.models", "memoria.llm", "memoria.server", "memoria.server.routes", "memoria.cli", "memoria.vault"]

[tool.pytest.ini_options]
testpaths = ["tests"]

